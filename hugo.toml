baseURL = 'https://www.jeffyang.io/'
languageCode = 'en-us'
title = "Read Only Memory"
copyright = 'Jeff Yang'
theme = 'ritzy'
enableRobotsTXT = true

[services.rss]
  limit = 20

[outputs]
  home = ['html']
  section = ['html', 'rss']
  page = ['html']

[params]
  author = 'Jeff Yang'
  description = 'Thoughts from a life in progress.'

[markup]
  [markup.highlight]
    noClasses = false
    style = 'pygments'

  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true

# Only publish bundle files (e.g. original images) that templates actually reference.
# Originals stay in git; the site serves the resized WebP versions.
[[cascade]]
  [cascade.build]
    publishResources = false
  [cascade.target]
    path = '/posts/**'
